name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create . --platforms=android --project-name flux
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's#android:label="[^"]*"#android:label="claude roi"#' android/app/src/main/AndroidManifest.xml
      - name: Desactiver lint
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
            tasks.whenTaskAdded { task ->
              if (task.name.startsWith("lintVital")) { task.enabled = false }
            }
          }
          EOF
      - run: flutter pub get
      - run: printf 'allprojects {\n afterEvaluate { p ->\n if (p.hasProperty("android")) { p.android.compileSdkVersion(36) }\n }\n}\n' >> ~/.gradle/init.gradle
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
